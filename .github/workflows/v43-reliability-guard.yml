name: V4.3 Reliability Guard

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  reliability-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Runtime
        run: node --version

      - name: V4.3 regression guard
        run: node tests/v43-guard.mjs

      - name: SQL reproducibility guard
        run: node tests/sql-repro-guard.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Live GitHub Pages smoke test
        run: node tests/v43-browser-smoke.mjs
